# Native per-OS builds. Version comes from the git tag (APP_VERSION).
# Artifacts: lotustab-{target}-{arch}-{version}.{ext}
# https://v3.wails.io/guides/build/cross-platform/

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin
            arch: universal
          - os: windows-latest
            target: windows
            arch: amd64
          # - os: ubuntu-latest
          #   target: linux
          #   arch: amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # - name: Install Linux UI deps
      #   if: matrix.target == 'linux'
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.14

      - name: Package macOS universal .app and DMG
        if: matrix.target == 'darwin'
        run: |
          wails3 task darwin:package:universal
          wails3 task darwin:create:dmg
          lipo -archs bin/lotustab.app/Contents/MacOS/lotustab
          NAME="lotustab-${{ matrix.target }}-${{ matrix.arch }}-${GITHUB_REF_NAME}"
          ditto -c -k --keepParent bin/lotustab.app bin/${NAME}.zip
          shopt -s nullglob
          for f in bin/*.dmg; do mv "$f" bin/${NAME}.dmg; done
          (cd bin && shasum -a 256 lotustab-* > SHA256SUMS)

      - name: Build Windows
        if: matrix.target == 'windows'
        run: |
          wails3 task windows:build
          NAME="lotustab-${{ matrix.target }}-${{ matrix.arch }}-${GITHUB_REF_NAME}"
          mv bin/lotustab.exe bin/${NAME}.exe
          (cd bin && (command -v sha256sum >/dev/null && sha256sum lotustab-* || shasum -a 256 lotustab-*) > SHA256SUMS)

      # - name: Build Linux
      #   if: matrix.target == 'linux'
      #   run: |
      #     wails3 task linux:build
      #     NAME="lotustab-${{ matrix.target }}-${{ matrix.arch }}-${GITHUB_REF_NAME}"
      #     tar -czf bin/${NAME}.tar.gz -C bin lotustab
      #     (cd bin && sha256sum lotustab-* > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: lotustab-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            bin/lotustab-*
            bin/SHA256SUMS
          if-no-files-found: error

  # One release upload so Mac/Windows do not race on SHA256SUMS.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: lotustab-*
          merge-multiple: false

      - name: Merge checksums and stage assets
        run: |
          set -euo pipefail
          mkdir -p release
          : > release/SHA256SUMS
          for dir in dist/lotustab-*; do
            [ -d "$dir" ] || continue
            if [ -f "$dir/SHA256SUMS" ]; then
              cat "$dir/SHA256SUMS" >> release/SHA256SUMS
            fi
            shopt -s nullglob
            for f in "$dir"/lotustab-*; do
              mv "$f" release/
            done
          done
          echo "--- staged ---"
          ls -la release
          echo "--- SHA256SUMS ---"
          cat release/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
